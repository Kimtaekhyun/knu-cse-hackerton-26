[project]
name = "pansoham-server"
version = "0.1.0"
description = "chalkdrop 백엔드 (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic-settings",
    "google-genai",
    "httpx",
    "pillow",
    "numpy",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pyjwt>=2.15.1",
    "anthropic>=2.11.0",
    "opencv-python-headless>=5.1.0.95",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
