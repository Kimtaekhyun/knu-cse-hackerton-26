# chalkdrop 개발 환경. BE · FE 모두 `docker compose up` 한 줄로 DB와 API 서버를 띄운다.
# - API 코드(./server)를 컨테이너에 연결해서 저장하면 서버가 자동으로 다시 시작된다
# - DB 데이터와 업로드 이미지는 볼륨에 남는다 (지우려면 docker compose down -v)
services:
  db:
    image: postgres:17
    environment:
      # 개발용 계정 · 비밀번호 (관리자 계정). 아래 포트가 이 노트북 안에서만 열려 있어 바깥에서는 쓸 수 없다
      POSTGRES_USER: pansoham
      POSTGRES_PASSWORD: pansoham
      POSTGRES_DB: pansoham
    ports:
      # 이 노트북 안(127.0.0.1)에서만 연다. 같은 Wi-Fi의 다른 기기는 DB에 붙을 수 없다 (#129)
      # - API 컨테이너는 내부 이름 db:5432로 붙으므로 영향 없음
      # - 포트를 아예 지우면 노트북에서 uv run · DB 도구로 localhost:5432에 붙는 사용법이 깨진다
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pansoham"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./server
    ports:
      - "8000:8000"
    env_file:
      # ANTHROPIC_API_KEY 등. 없어도 서버는 뜬다 (시간표 · 판서 인식만 안 됨)
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://pansoham:pansoham@db:5432/pansoham
      # 판서 사진 저장 위치. 아래 media 볼륨이라 컨테이너를 다시 만들어도 남는다
      MEDIA_DIR: /media
    volumes:
      - ./server:/app
      - media:/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
